[project]
name = "cosmane-class4"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.156.4",
    "openpyxl>=3.1.5",
    "ortools>=9.15.6755",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
